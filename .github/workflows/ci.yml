name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            command: ./tests/test.sh
          - os: macos-14
            shell: bash
            command: ./tests/test.sh
          - os: windows-latest
            shell: pwsh
            command: ./tests/test-windows.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run offline safety and regression tests
        shell: ${{ matrix.shell }}
        run: ${{ matrix.command }}
