name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-unix:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run offline safety and regression tests
        run: ./tests/test.sh

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run offline safety and regression tests
        shell: pwsh
        run: ./tests/test-windows.ps1
