<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Call Grok pinned release installation flow</title>
  <desc id="desc">The Codex Marketplace add and plugin install flow for a pinned public Call Grok release.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5cffb0"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="520" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1278" height="518" rx="27" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect x="0" y="0" width="1280" height="64" rx="28" fill="#161b22"/>
  <path d="M0 36 Q0 0 28 0 H1252 Q1280 0 1280 28 V64 H0Z" fill="#161b22"/>
  <circle cx="34" cy="32" r="7" fill="#ff7b72"/>
  <circle cx="58" cy="32" r="7" fill="#d29922"/>
  <circle cx="82" cy="32" r="7" fill="#3fb950"/>
  <text x="640" y="40" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">PINNED RELEASE INSTALL · REPRODUCIBLE · AUTH ON USE</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="46" y="112" fill="#5cffb0">$</text>
    <text x="76" y="112" fill="#e6edf3">codex plugin marketplace add wuxie888/call-grok --ref v1.2.0</text>
    <rect x="46" y="138" width="1188" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
    <circle cx="76" cy="167" r="10" fill="#238636"/>
    <path d="M70 167 L74 171 L82 162" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="101" y="174" fill="#b1bac4">marketplace</text>
    <text x="252" y="174" fill="#e6edf3">call-grok</text>
    <text x="392" y="174" fill="#6e7681">· public Git source · tag pinned</text>

    <text x="46" y="242" fill="#5cffb0">$</text>
    <text x="76" y="242" fill="#e6edf3">codex plugin add call-grok@call-grok</text>
    <rect x="46" y="268" width="1188" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
    <circle cx="76" cy="297" r="10" fill="#238636"/>
    <path d="M70 297 L74 301 L82 292" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="101" y="304" fill="#b1bac4">plugin</text>
    <text x="195" y="304" fill="#e6edf3">call-grok@call-grok</text>
    <text x="487" y="304" fill="#6e7681">· 1.2.0 · auth ON_USE</text>

    <path d="M46 370 H1234" stroke="url(#line)" stroke-width="2"/>
    <text x="46" y="418" fill="#8b949e">NEW CODEX TASK</text>
    <text x="46" y="458" fill="#e6edf3">用 $call-grok 查一下 X 上最近大家怎么评价这个项目</text>
    <text x="46" y="490" fill="#5cffb0">ready</text>
    <text x="118" y="490" fill="#8b949e">→ X status links · evidence · confidence · gaps</text>
  </g>
